<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeartGuard AI | Prediction System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="main-wrapper">
        <header>
            <h1>❤️ HeartGuard <span>AI</span></h1>
            <p>Advanced Cardiovascular Risk Assessment</p>
        </header>

        <section class="form-container">
            <form id="predictionForm" action="/predict" method="POST">
                <div class="input-grid">
                    <div class="input-group">
                        <label>Age</label>
                        <input type="number" name="age" placeholder="e.g. 45" required>
                    </div>

                    <div class="input-group">
                        <label>Sex</label>
                        <select name="sex">
                            <option value="1">Male</option>
                            <option value="0">Female</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Chest Pain Type (0-3)</label>
                        <input type="number" name="cp" min="0" max="3" required>
                    </div>

                    <div class="input-group">
                        <label>Resting BP (mm Hg)</label>
                        <input type="number" name="trestbps" required>
                    </div>

                    <div class="input-group">
                        <label>Cholesterol (mg/dl)</label>
                        <input type="number" name="chol" required>
                    </div>

                    <div class="input-group">
                        <label>Fasting Blood Sugar > 120 mg/dl</label>
                        <select name="fbs">
                            <option value="1">True (1)</option>
                            <option value="0">False (0)</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Resting ECG (0-2)</label>
                        <input type="number" name="restecg" min="0" max="2" required>
                    </div>

                    <div class="input-group">
                        <label>Max Heart Rate</label>
                        <input type="number" name="thalach" required>
                    </div>

                    <div class="input-group">
                        <label>Exercise Induced Angina</label>
                        <select name="exang">
                            <option value="1">Yes (1)</option>
                            <option value="0">No (0)</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Oldpeak (ST Depression)</label>
                        <input type="number" step="0.1" name="oldpeak" required>
                    </div>

                    <div class="input-group">
                        <label>Slope of ST Segment (0-2)</label>
                        <input type="number" name="slope" min="0" max="2" required>
                    </div>

                    <div class="input-group">
                        <label>No. of Major Vessels (0-3)</label>
                        <input type="number" name="ca" min="0" max="3" required>
                    </div>

                    <div class="input-group">
                        <label>Thalassemia (1-3)</label>
                        <input type="number" name="thal" min="1" max="3" required>
                    </div>
                </div>
                
                <button type="submit" class="btn-predict">Analyze Health Data</button>
            </form>

            {% if prediction_text %}
            <div class="result-card animated fadeIn">
                <h3>Analysis Result:</h3>
                <p class="{{ 'danger' if 'Positive' in prediction_text else 'success' }}">
                    {{ prediction_text }}
                </p>
            </div>
            {% endif %} 
        </section>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
